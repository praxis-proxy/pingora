[package]
name = "quixotic-plecostomus-load-balancing"
version = "0.8.2"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/praxis-proxy/pingora"
categories = ["network-programming"]
keywords = ["proxy", "pingora"]
description = """
Common load balancing features for Pingora proxy.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pingora_load_balancing"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
pingora-http = { version = "0.8.2", path = "../pingora-http", package = "quixotic-plecostomus-http" }
pingora-error = { version = "0.8.2", path = "../pingora-error", package = "quixotic-plecostomus-error" }
pingora-core = { version = "0.8.2", path = "../pingora-core", default-features = false, package = "quixotic-plecostomus-core" }
pingora-ketama = { version = "0.8.2", path = "../pingora-ketama", package = "quixotic-plecostomus-ketama" }
pingora-runtime = { version = "0.8.2", path = "../pingora-runtime", package = "quixotic-plecostomus-runtime" }
arc-swap = "1"
fnv = "1"
rand = "0.10"
tokio = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
http = { workspace = true }

[dev-dependencies]

[features]
default = []
openssl = ["pingora-core/openssl", "openssl_derived"]
boringssl = ["pingora-core/boringssl", "openssl_derived"]
rustls = ["pingora-core/rustls", "any_tls"]
s2n = ["pingora-core/s2n", "any_tls"]
openssl_derived = ["any_tls"]
any_tls = []
v2 = ["pingora-ketama/v2"]
